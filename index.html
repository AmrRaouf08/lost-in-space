<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOST IN SPACE — Stories of machines left on other worlds</title>
<meta name="description" content="A scroll-through journey to the Moon and Mars to meet the machines left behind: the lunar rovers, the twin Mars rovers Spirit and Opportunity, and the Ingenuity helicopter.">
<meta name="theme-color" content="#0a0d2a">
<meta property="og:type" content="website">
<meta property="og:title" content="LOST IN SPACE: left behind, never forgotten">
<meta property="og:description" content="Fly to the Moon and Mars and hear the stories of the machines left behind. Made for the 2026 NASA Space Apps Challenge.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛰️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0d2a; --dust:#fff7ea; --muted:#c3c9ee; --gold:#ffd166; --pink:#ff5d8f;
  --c1:#4b5bd6; --c2:#0a0d2a;
  --serif:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#0a0d2a; --dust:#fff7ea; } }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink);color:var(--dust);font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 120% 80% at 50% 110%,var(--c1),var(--c2) 70%)}
#stars{position:fixed;left:0;top:0;width:100%;height:130vh;z-index:-1;pointer-events:none}
a{color:var(--gold)} :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#scene3d{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#stars{display:none}
